name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - main
      - "release/**"
    paths:
      - ".agents/**"
      - ".codex/**"
      - ".skills/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "bench/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual release operation."
        type: choice
        required: true
        default: retry
        options:
          - retry
          - snapshot
      tag:
        description: "Existing version tag to retry after an npm publication failure."
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'ci' }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'none' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'snapshot' }}

jobs:
  fast:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Classify changed files
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            fast:
              - ".agents/**"
              - ".codex/**"
              - ".skills/**"
              - ".github/workflows/**"
              - "AGENTS.md"
              - "bench/**"
              - "scripts/**"
              - "src/**"
              - "tests/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "tsconfig*.json"
              - "vitest.config.ts"

      - name: Checkout
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm install --frozen-lockfile

      - name: Agent contract
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm agents:check

      - name: Agent contract smoke
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm exec vitest run tests/agent-contract.test.ts

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm build

      - name: Type lint
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm type-lint

      - name: Node runtime script smoke
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: node ./dist/scripts/release-agent.js --base HEAD

      - name: Node package smoke
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm test:package-bin

      - name: MCP stdio smoke
        if: github.event_name == 'push' || steps.changes.outputs.fast == 'true'
        run: pnpm exec vitest run tests/interface.test.ts -t "boots the SDK-backed MCP stdio server"

      - name: Version policy
        if: github.event_name == 'pull_request' && steps.changes.outputs.fast == 'true'
        run: pnpm check:version-bump --base "origin/${{ github.base_ref }}"

      - name: Version policy on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm check:version-bump --base "${{ github.event.before }}"

      - name: Record skipped validation
        if: github.event_name == 'pull_request' && steps.changes.outputs.fast != 'true'
        run: echo "Fast checks skipped because this pull request does not change code, configuration, tests, package metadata, or CI." >> "$GITHUB_STEP_SUMMARY"

  # Kept intact for a future re-enable. Set this back to the original draft
  # condition and add `windows` back to `release_agent.needs` when hosted
  # Windows minutes are available again.
  windows:
    name: Windows compatibility
    runs-on: windows-latest
    timeout-minutes: 15
    if: ${{ false }} # Disabled: avoid paid GitHub-hosted Windows runner minutes.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-lint
      - name: Windows filesystem scan
        shell: pwsh
        run: ./scripts/run-windows-vitest.ps1 tests/filesystem-scan.test.ts
      - name: Windows engine behavior
        shell: pwsh
        run: ./scripts/run-windows-vitest.ps1 tests/engine-behavior.test.ts
      - name: Windows Git checkout
        shell: pwsh
        run: ./scripts/run-windows-vitest.ps1 tests/git-checkout.test.ts
      - name: Windows watch backend
        shell: pwsh
        run: ./scripts/run-windows-vitest.ps1 tests/watch-backend.test.ts
      - name: Windows watch boundary
        shell: pwsh
        run: ./scripts/run-windows-vitest.ps1 tests/watch-boundary.test.ts
      - run: pnpm test:package-bin

  release_agent:
    name: Tag and publish merged release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fast]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.fast.result == 'success'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read merged PR release exception
        id: release_exception
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          no_release="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | any(.labels[]; .name == "no-release")] | any' || echo false)"
          echo "no_release=${no_release}" >> "$GITHUB_OUTPUT"

      - name: Decide release
        id: release
        run: |
          set -o pipefail
          args=(--merged-candidate)
          if [ "${{ steps.release_exception.outputs.no_release }}" = "true" ]; then
            args+=(--no-release)
          fi
          node --import=tsx ./src/scripts/release-agent.ts "${args[@]}" \
            | tee "$RUNNER_TEMP/astrograph-release-decision.json"
          {
            echo "## Astrograph release decision"
            echo
            echo "Candidate SHA: \`${GITHUB_SHA}\`"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/astrograph-release-decision.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e '.transactionAction == "reject"' \
            "$RUNNER_TEMP/astrograph-release-decision.json" >/dev/null; then
            echo "Release candidate was rejected before tag or npm publication."
            exit 1
          fi

      - name: Build exact release artifact
        id: artifact
        if: steps.release.outputs.should_release == 'true'
        run: >-
          pnpm release:artifact
          --output-dir "$RUNNER_TEMP/astrograph-release"
          --version "${{ steps.release.outputs.target_version }}"
          --sha "$GITHUB_SHA"

      - name: Smoke exact release artifact
        if: steps.release.outputs.should_release == 'true'
        run: >-
          node --import=tsx ./src/scripts/smoke-package-bin.ts
          --prebuilt
          --tarball "${{ steps.artifact.outputs.tarball_path }}"
          --expected-version "${{ steps.release.outputs.target_version }}"

      - name: Push release tag
        if: steps.release.outputs.should_release == 'true'
        run: |
          git tag "${{ steps.release.outputs.target_tag }}"
          git push origin "${{ steps.release.outputs.target_tag }}"

      - name: Record tag result
        if: steps.release.outputs.should_release == 'true'
        run: |
          {
            echo
            echo "Tag pushed: \`${{ steps.release.outputs.target_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish trusted npm release
        if: steps.release.outputs.should_release == 'true'
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball_path }}"
          --provenance
          --access public
          --tag latest

      - name: Verify npm release artifact
        if: steps.release.outputs.should_release == 'true'
        env:
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.release.outputs.target_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            latest_version="$(npm view astrograph@latest version 2>/dev/null || true)"
            test "$latest_version" = "$EXPECTED_VERSION" && break
            sleep 2
          done
          test "$latest_version" = "$EXPECTED_VERSION"
          tarball_url="$(npm view "astrograph@$EXPECTED_VERSION" dist.tarball)"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/astrograph-release-readback.tgz" "$tarball_url"
          actual_digest="$(sha256sum "$RUNNER_TEMP/astrograph-release-readback.tgz" | cut -d ' ' -f 1)"
          test "$actual_digest" = "$EXPECTED_DIGEST"

      - name: Record publication result
        if: steps.release.outputs.should_release == 'true'
        run: |
          {
            echo
            echo "npm published: \`astrograph@${{ steps.release.outputs.target_version }}\`"
            echo "SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  retry_publish:
    name: Retry a tagged npm publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'retry'
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "The retry mode requires the tag input."
            exit 1
          fi
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$expected_tag'."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build exact retry artifact
        id: artifact
        run: |
          pnpm release:artifact \
            --output-dir "$RUNNER_TEMP/astrograph-release" \
            --version "$(node -p "require('./package.json').version")" \
            --sha "$(git rev-parse HEAD)"

      - name: Smoke exact retry artifact
        run: >-
          node --import=tsx ./src/scripts/smoke-package-bin.ts
          --prebuilt
          --tarball "${{ steps.artifact.outputs.tarball_path }}"
          --expected-version "${{ steps.artifact.outputs.package_version }}"

      - name: Publish trusted npm release
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball_path }}"
          --provenance
          --access public
          --tag latest

      - name: Verify retried npm release artifact
        env:
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.artifact.outputs.package_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            latest_version="$(npm view astrograph@latest version 2>/dev/null || true)"
            test "$latest_version" = "$EXPECTED_VERSION" && break
            sleep 2
          done
          test "$latest_version" = "$EXPECTED_VERSION"
          tarball_url="$(npm view "astrograph@$EXPECTED_VERSION" dist.tarball)"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/astrograph-release-readback.tgz" "$tarball_url"
          actual_digest="$(sha256sum "$RUNNER_TEMP/astrograph-release-readback.tgz" | cut -d ' ' -f 1)"
          test "$actual_digest" = "$EXPECTED_DIGEST"

  snapshot_publish:
    name: Publish npm snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot'
    permissions:
      contents: read
      "id-token": write
    environment: npm
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify selected commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Record current latest
        id: before
        run: echo "latest=$(npm view astrograph@latest version)" >> "$GITHUB_OUTPUT"

      - name: Build one immutable snapshot artifact
        id: artifact
        run: >-
          pnpm release:artifact
          --output-dir "$RUNNER_TEMP/astrograph-snapshot"
          --run-id "$GITHUB_RUN_ID"
          --sha "$GITHUB_SHA"

      - name: Smoke exact snapshot artifact
        run: >-
          node --import=tsx ./src/scripts/smoke-package-bin.ts
          --prebuilt
          --tarball "${{ steps.artifact.outputs.tarball_path }}"
          --expected-version "${{ steps.artifact.outputs.package_version }}"

      - name: Publish exact snapshot artifact
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball_path }}"
          --provenance
          --access public
          --tag snapshot

      - name: Verify registry publication
        env:
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_LATEST: ${{ steps.before.outputs.latest }}
          EXPECTED_VERSION: ${{ steps.artifact.outputs.package_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            snapshot_version="$(npm view astrograph@snapshot version 2>/dev/null || true)"
            test "$snapshot_version" = "$EXPECTED_VERSION" && break
            sleep 2
          done
          latest_version="$(npm view astrograph@latest version)"
          test "$snapshot_version" = "$EXPECTED_VERSION"
          test "$latest_version" = "$EXPECTED_LATEST"
          tarball_url="$(npm view "astrograph@$EXPECTED_VERSION" dist.tarball)"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/astrograph-readback.tgz" "$tarball_url"
          actual_digest="$(sha256sum "$RUNNER_TEMP/astrograph-readback.tgz" | cut -d ' ' -f 1)"
          test "$actual_digest" = "$EXPECTED_DIGEST"

      - name: Record snapshot result
        run: |
          {
            echo "## Astrograph npm snapshot"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Version: \`${{ steps.artifact.outputs.package_version }}\`"
            echo "SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
            echo "Dist-tag: \`snapshot\`"
          } >> "$GITHUB_STEP_SUMMARY"
